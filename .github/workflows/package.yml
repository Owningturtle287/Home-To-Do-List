name: Package Roomstead

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'scripts/package_roomstead.py'
      - 'app.js'
      - 'icons.js'
      - 'index.html'
      - 'model.js'
      - 'seed.js'
      - 'styles.css'
      - 'assets/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the offline app
        run: python3 scripts/package_roomstead.py . output/Roomstead.html
      - name: Upload the downloadable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Roomstead
          path: output/Roomstead.html
          if-no-files-found: error
          retention-days: 90
