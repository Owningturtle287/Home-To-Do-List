name: Package Roomstead

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'scripts/package_roomstead.py'
      - 'app.js'
      - 'icons.js'
      - 'index.html'
      - 'model.js'
      - 'seed.js'
      - 'styles.css'
      - 'assets/**'

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the offline app
        run: python3 scripts/package_roomstead.py . output/Roomstead.html
      - name: Upload the downloadable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Roomstead
          path: output/Roomstead.html
          if-no-files-found: error
          retention-days: 90

      - name: Publish a direct ZIP download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -m zipfile -c output/Roomstead.zip output/Roomstead.html
          tag="roomstead-build-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$tag" --json url >/dev/null 2>&1; then
            gh release create "$tag" output/Roomstead.zip \
              --target "$GITHUB_SHA" \
              --title "Roomstead download #${GITHUB_RUN_NUMBER}" \
              --notes "Offline web app with the sample checklist. Extract Roomstead.zip and open Roomstead.html in a desktop browser." \
              --latest=false
          fi
          gh release view "$tag" --json assets,isDraft \
            --jq 'select(.isDraft == false) | .assets[].name' | grep -Fx 'Roomstead.zip'
          download="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/Roomstead.zip"
          printf '## Download Roomstead\n\n**[Download Roomstead.zip](%s)**\n\nUnzip it and open `Roomstead.html` in a desktop browser.\n' "$download" >> "$GITHUB_STEP_SUMMARY"
